# local-inference-studio-mac configuration.
# Plain KEY=VALUE lines. Scripts PARSE this file; it is never sourced, so no quoting,
# no $expansion, no command substitution. Blank lines and lines starting with # are
# ignored. Values are taken literally up to the end of the line.
#
# PORT        loopback port llama-server listens on (127.0.0.1 only).
# CTX         llama-server context size (-c).
# CLIENT_CTX  the context window the Claude Code client is told about (read by the
#             client side; serve.sh ignores it). Keep it below CTX.
# KV_TYPE     KV cache type for K and V (-ctk/-ctv): f32 f16 bf16 f8_e4m3 q8_0 q4_0 q4_1 iq4_nl q5_0 q5_1.
#             f16 = not quantized (llama-server's default). A manifest entry's kv_type
#             overrides this for that model.
# MODEL_ID    the "id" of one entry in models/manifest.json. Empty until a model is chosen.
# CHAT_TEMPLATE optional repo-relative path to a .jinja chat template under config/
#             (--chat-template-file), e.g. config/chat-templates/<name>.jinja; a
#             symlink, or a path that leads outside config/, refuses the start.
#             Empty = the template embedded in the GGUF. A manifest entry's
#             chat_template replaces this for that model (same checks).
PORT=8080
CTX=131072
CLIENT_CTX=114688
KV_TYPE=q4_0
MODEL_ID=qwen3.6-35b-a3b-heretic-iq3m
CHAT_TEMPLATE=
